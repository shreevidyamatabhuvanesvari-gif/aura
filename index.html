<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="AURA Production Intelligence Console">

<meta
    name="theme-color"
    content="#0f172a">

<title>

AURA Production Console

</title>

<link
    rel="icon"
    href="assets/icons/aura.ico">

<link
    rel="stylesheet"
    href="assets/css/aura-console.css">

</head>

<body>

<div
    id="app">

    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <header
        class="app-header">

        <div
            class="brand">

            <h1>

                AURA

            </h1>

            <span
                class="version">

                Production Console
                v2.0

            </span>

        </div>

        <div
            class="system-status">

            <span
                id="systemIndicator"
                class="online">

            </span>

            <span
                id="systemStatus">

                System Ready

            </span>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- STATUS BAR -->
    <!-- ===================================================== -->

    <section
        class="status-bar">

        <div>

            Engine

            <strong
                id="engineStatus">

                Ready

            </strong>

        </div>

        <div>

            Boot

            <strong
                id="bootTime">

                --

            </strong>

        </div>

        <div>

            Commands

            <strong
                id="commandCount">

                0

            </strong>

        </div>

    </section>

    <!-- ===================================================== -->
    <!-- TOOLBAR -->
    <!-- ===================================================== -->

    <nav
        class="toolbar">

        <button
            id="executeButton">

            Execute

        </button>

        <button
            id="copyButton">

            Copy

        </button>

        <button
            id="clearButton">

            Clear

        </button>

        <button
            id="downloadButton">

            Download

        </button>

    </nav>

    <!-- ===================================================== -->
    <!-- MAIN CONSOLE -->
    <!-- ===================================================== -->

    <main
        class="console-layout">
        <!-- ===================================================== -->
        <!-- COMMAND PANEL -->
        <!-- ===================================================== -->

        <section
            class="command-panel">

            <label
                for="commandInput">

                Command

            </label>

            <textarea
                id="commandInput"
                placeholder="Enter command..."></textarea>

            <div
                class="command-info">

                <span id="characterCount">

                    Characters : 0

                </span>

                <span id="shortcutInfo">

                    Ctrl + Enter = Execute

                </span>

            </div>

        </section>

        <!-- ===================================================== -->
        <!-- OUTPUT PANEL -->
        <!-- ===================================================== -->

        <section
            class="output-panel">

            <div
                class="output-header">

                <h2>

                    Output

                </h2>

                <span
                    id="executionTime">

                    Ready

                </span>

            </div>

            <pre
                id="outputConsole">

Awaiting command...

            </pre>

        </section>

    </main>

    <!-- ===================================================== -->
    <!-- TOAST CONTAINER -->
    <!-- ===================================================== -->

    <div
        id="toastContainer">

    </div>

    <!-- ===================================================== -->
    <!-- MODAL CONTAINER -->
    <!-- ===================================================== -->

    <div
        id="modalContainer">

    </div>

    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <footer
        class="app-footer">

        <span>

            AURA Production Console

        </span>

        <span
            id="buildVersion">

            Build :
            2.0.0

        </span>

    </footer>

</div>

<!-- ===================================================== -->
<!-- USER INTERFACE -->
<!-- ===================================================== -->

<script
    src="assets/js/aura-console-ui.js"></script>

<!-- ===================================================== -->
<!-- BOOTSTRAP -->
<!-- ===================================================== -->

<script
    src="assets/js/aura-bootstrap.js"></script>

<!-- ===================================================== -->
<!-- AURA ENGINES -->
<!-- ===================================================== -->
        
<!-- Foundation -->
<script src="assets/js/task-manager.js"></script>
<script src="assets/js/storage-engine.js"></script>

<!-- Knowledge Layer -->
<script src="assets/js/knowledge-engine.js"></script>
<script src="assets/js/learning-engine.js"></script>
<script src="assets/js/knowledge-import-engine.js"></script>

<!-- Memory Layer -->
<script src="assets/js/content-memory-engine.js"></script>
<script src="assets/js/pattern-extraction-engine.js"></script>
<script src="assets/js/memory-consolidation-engine.js"></script>

<!-- Fragment Layer -->
<script src="assets/js/knowledge-fragment-engine.js"></script>

<!-- Graph Layer -->
<script src="assets/js/knowledge-graph-engine.js"></script>
<script src="assets/js/semantic-network-engine.js"></script>

<!-- Learning Core -->
<script src="assets/js/learning-core-engine.js"></script>

<!-- Cognitive Layer -->
<script src="assets/js/reasoning-engine.js"></script>
<script src="assets/js/human-reasoning-engine.js"></script>
<script src="assets/js/self-critic-engine.js"></script>
<script src="assets/js/planner-engine.js"></script>
<script src="assets/js/insight-engine.js"></script>

<!-- Creative Layer -->
<script src="assets/js/creative-mind-engine.js"></script>

<!-- Philosophy Layer -->
<script src="assets/js/philosophy-engine.js"></script>
    
<!-- Question Answer Layer -->
<script src="assets/js/question-answer-engine.js"></script>

<!-- Comparison Layer -->
<script src="assets/js/comparison-engine.js"></script>

<!-- Goal & Meta Layer -->
<script src="assets/js/goal-manager.js"></script>
<script src="assets/js/meta-learning-engine.js"></script>
<script src="assets/js/self-improvement-engine.js"></script>

<!-- Semantic Search Layer -->
<script src="assets/js/embedding-engine.js"></script>
<script src="assets/js/vector-search-engine.js"></script>

<!-- Feedback Layer -->
<script src="assets/js/feedback-engine.js"></script>

<!-- Hindi Layer -->
<script src="assets/js/hindi-interaction-engine.js"></script>
<script src="assets/js/hindi-intent-engine.js"></script>
<script src="assets/js/hindi-command-router.js"></script>

<!-- Command Infrastructure -->
<script src="assets/js/command-manifest.js"></script>
<script src="assets/js/command-registry.js"></script>

<!-- Command Bootstraps -->
<script src="assets/js/command-bootstrap.js"></script>
<script src="assets/js/command-bootstrap-v2.js"></script>
<script src="assets/js/command-bootstrap-v3.js"></script>
<script src="assets/js/command-bootstrap-v4.js"></script>
<script src="assets/js/command-bootstrap-v5.js"></script>
<script src="assets/js/command-bootstrap-v6.js"></script>
<script src="assets/js/command-bootstrap-v7.js"></script>
<script src="assets/js/command-bootstrap-v8.js"></script>

<!-- Creative Commands -->
<script src="assets/js/creative-command-bootstrap.js"></script>

<!-- Main Engine -->
<script src="assets/js/core-command-engine-v14.js"></script>

</body>
</html>
